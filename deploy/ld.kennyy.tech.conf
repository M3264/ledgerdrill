server {
    listen 80;
    listen [::]:80;
    server_name ld.kennyy.tech;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://ld.kennyy.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ld.kennyy.tech;
    ssl_certificate /etc/letsencrypt/live/ld.kennyy.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ld.kennyy.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;
    limit_req_status 429;
    error_page 429 = @ledgerdrill_rate_limited;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        limit_req zone=ledgerdrill_writes burst=10 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 110s;
    }
    location @ledgerdrill_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"error":"The shared demo request limit was reached. Wait a minute and try again, or use a local instance."}';
    }
}
