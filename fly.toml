# Set your own unique app name and LEDGERDRILL_TOKEN before deployment.
app = "ledgerdrill-change-me"
primary_region = "ams"
[build]
  dockerfile = "Dockerfile"
[http_service]
  internal_port = 8098
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[mounts]]
  source = "ledgerdrill_data"
  destination = "/data"
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"
